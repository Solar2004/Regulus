# Regulus — workspace raíz (docs/02-architecture.md §3).
[workspace]
members = [
    "crates/regulus-proto",
    "crates/regulus-core",
    "crates/regulus-cli",
    "crates/regulus-acp",
    "crates/contracts/agent-engine",
    "crates/contracts/llm-endpoint",
    "crates/contracts/skill",
    "crates/contracts/participant",
    "crates/contracts/tool",
    "crates/contracts/toolset",
    "crates/contracts/decision",
    "crates/contracts/chunker",
    "crates/contracts/retrieval-engine",
    "crates/modules/hello",
    "crates/modules/flow",
    "crates/modules/hooks",
    "crates/modules/agent",
    "crates/modules/engine-opencode",
    "crates/modules/engine-claude",
    "crates/modules/providers",
    "crates/modules/skills",
    "crates/modules/communication",
    "crates/modules/tools",
    "crates/modules/tools-mcp",
    "crates/modules/files",
    "crates/regulus-tauri/src-tauri",
    "crates/modules/process",
    "crates/modules/guards",
    "crates/modules/judge",
    "crates/modules/triggers",
    "crates/modules/memory",
    "crates/modules/web",
    "crates/modules/human",
    "crates/modules/service",
    "crates/modules/tasks",
    "crates/modules/workspace",
    "crates/modules/documents",
    "crates/modules/inference",
    "crates/modules/engine-native",
    "crates/modules/delegation",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Alexander"]
license = "Apache-2.0"

# Versiones verificadas: docs/06-stack.md §2.1 (único sitio donde se documentan).
[workspace.dependencies]
regulus-proto = { path = "crates/regulus-proto" }
regulus-core = { path = "crates/regulus-core" }
regulus-acp = { path = "crates/regulus-acp" }
regulus-contract-agent-engine = { path = "crates/contracts/agent-engine" }
regulus-contract-llm-endpoint = { path = "crates/contracts/llm-endpoint" }
regulus-contract-skill = { path = "crates/contracts/skill" }
regulus-contract-participant = { path = "crates/contracts/participant" }
regulus-contract-tool = { path = "crates/contracts/tool" }
regulus-contract-toolset = { path = "crates/contracts/toolset" }
regulus-contract-decision = { path = "crates/contracts/decision" }
regulus-contract-chunker = { path = "crates/contracts/chunker" }
regulus-contract-retrieval-engine = { path = "crates/contracts/retrieval-engine" }
agent-client-protocol = "3.4.0"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
getrandom = "0.4"
glob = "0.3.4"
jsonrpsee = "0.26.1"
notify = "8.2"
ratatui = "0.30.2"
regex = "1.13"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
toml = "1"
tower = "0.5"
ureq = { version = "3.5", features = ["json"] }
httparse = "1.10"
croner = "4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
semver = "1.0.28"
base64 = "0.22"
blake2 = "0.11"
ed25519-dalek = "3"
minisign-verify = "0.3"
self-replace = "1.5"

# Perfil release (en un workspace solo la raíz define profiles).
# Ver https://tauri.app/concept/size/#cargo-configuration
#
# Sin `panic = "abort"`: el core contiene el pánico de un módulo con `catch_unwind`
# (docs/03-modules.md §2.2) y eso solo funciona si el pánico desenrolla.
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
