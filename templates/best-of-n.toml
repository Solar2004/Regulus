# Best-of-N (docs/13-blocks.md §5 row 5): N agents try the same task, each in a git
# worktree of its own; a judge reads every attempt and picks one; only that one goes to a
# merge queue, which merges it into the base branch once a deterministic test passes.
# Sources: Orca (https://github.com/stablyai/orca, parallel agents in worktrees, by
# listings), best-of-N sampling and voting; the merge queue is Gas Town's Refinery.
#
#   self.go → loop (n turns) ─body→ attempts (call "attempt", one child per value) ─out→ collect
#              ▲    └─body→ back                                       (barrier, count = n)
#                                                                            │
#   cands (variable) ←─set───────────────────────────────────────────────────┤
#     │ get ←─ pick.out ←─ pick (extractor) ⇠ judge_model ←──────────────────┘
#     │          └→ winner_id → winner (variable) ─┐
#     └→ split ─each→ pair ←── winner.get ─────────┘
#                      └→ is_pick (gate: id == winner?) ─fail→ self.losers
#                              └pass→ to_info → info_json → queue ─check→ tests (gate) ─pass/fail→ queue
#                                                             └→ merged / conflict / rejected
#   attempt (child, one execution each):
#     ws (workspace git) ─info→ j_prompt ← self.in ;  j_prompt → compose → agent ⇠ engine
#     agent ─reply|failed→ j_reply ← ws.info ;  j_reply → path_of → diff (git diff) ─exit→ j_result
#     j_reply ─→ j_result → self.out = { summary: { info, reply }, diff: exit@1 }
#
# How it runs: the loop turns `n` times (its body goes straight back), so `n` copies of
# the task reach `call`, which starts one child execution of `attempt` per copy. Each child
# makes its worktree `<worktrees>/<execution id>` on branch `<branch_prefix><execution id>`
# from `base`, prompts its own agent with the task and the worktree's path, stages
# everything (`git add -A`) and answers `{ summary, diff }`. The barrier waits for the `n`
# answers; the extractor (a Judge-module node, strict schema `{ winner, reason }`) names
# the winner by its workspace id. Each candidate is then paired with that id and a shell
# gate compares the two: the winner's `info` goes to the merge queue, the others leave on
# `losers` (their branches and worktrees stay for a look). The queue sends the winner to
# `tests` (`test_command` inside its worktree); exit 0 merges it into `base` (`merged`),
# anything else rejects it (`rejected`).
#
# Limits, each a gap of the boxes, worked around in data:
# 1. Fixed: `ws.ready` goes to the Agent box's `workdir` input, so each agent's session
#    opens in its own worktree (the `workdir` field, `worktrees`, is only where it would
#    run if no path came). The cwd is where the agent starts, not a fence: with `allow` it
#    can still write elsewhere by absolute path.
# 2. No box picks element n of an array, and `flow` rules compare a value with a constant
#    only, so matching each candidate to the winner is a shell gate (`is_pick`) on the
#    JSON. Fix: a `switch`/`loop` rule `op` that compares two paths of the value
#    (`{ op = "equals", path = "/a", other = "/b" }`), or a `convert` that indexes by a path.
# 3. The merge queue merges only the first in line (`check` goes to the head), so the
#    losers are never queued: they would block it. Fix: none needed if only the winner is
#    queued; a `fail` naming each loser's `entry` would do it otherwise.
# 4. The barrier waits for exactly `n` answers: a child that never answers (git fails
#    to make its worktree, the core stops it) stalls the run; `regulus stop` it. Every
#    other failure still answers (a failed prompt is the reply, `diff` always exits).
# Also: `n` ≥ 1; 0 means no limit (the loop never stops making attempts). `n` above 4
# needs care: `call` starts all children at once (n opencode sessions); the loop's depth
# grows by 2 per turn under `[bus] max_depth`. The merge runs in the checkout of `base` in
# `repo`, which must be on that branch and clean. Folders and branches reuse execution
# ids, and `workspace` takes an existing `<worktrees>/<execution id>` as it is: use an
# empty `worktrees` folder, and a different `branch_prefix` if the repo already has such
# branches. The judge reads n × (`max_diff_bytes` + reply) at once: a model with a small
# context (Ollama's default) cuts it silently, so raise its context or lower
# `max_diff_bytes` (8000 by default). opencode's free models are not reachable outside
# opencode, so the judge needs its own provider (default `ollama`, local and free; or a
# paid one with `secret:`). `is_pick` reads the candidate on stdin, so its size is not
# bound by the per-argument limit.
#
# Risks: `permissions = "allow"` lets every agent edit files and run commands unattended,
# from its worktree, with the user's own opencode setup. The winner is merged into `base`
# with no person looking; put a `human` approval as a second gate of the queue
# (`approved` → `pass_human`, `rejected` → `fail_human`) to review first. The judge never
# verifies alone (§6), so `test_command` is required: the repo's tests, a build, a lint;
# `true` merges on the judge's word alone and must be a choice, not a default.
#
# Another engine: replace the node `engine` inside `attempt` (e.g. `engine-claude`; it
# has no `model` field). Another model: `--set model=provider/model`. Values with a double
# quote or a backslash are refused (docs/11-composition.md §7): a `test_command` that needs
# quotes goes in a script. `input` is not a hole: it keeps the process nodes' `{{input}}`.
#
# Run (2026-11-08, debug build, `regulus serve --port 0` with a temporary --home whose
# config.toml has `[templates] paths` on this folder; <repo> is a fresh git repo on
# `main` with one commit, <check>/check.sh prints its cwd and exits 0, the judge is a fake
# OpenAI-compatible server on 127.0.0.1:11471 that picks the first candidate mentioning
# "hello"; the agents are opencode with the free model):
#
#   regulus template apply best-of-n --set repo=<repo> --set worktrees=<wt> \
#     --set judge_model=fake-judge --set judge_base_url=http://127.0.0.1:11471/v1 \
#     --set n=2 --set test_command="sh <check>/check.sh"     # profile.check: []
#   regulus run best-of-n --detach                            # exec-2  running
#   regulus send exec-2 go "Create a file hello.txt containing the word hello. Nothing else."
#   regulus events --execution exec-2 | grep emitted          # (joins, converts left out)
#     loop.body emitted text@1 "Create a file hello.txt…"   (twice)
#     attempts.out emitted json@1 {"summary":{"info":{"id":"exec-4",…,"path":"<wt>/exec-4"…
#     attempts.out emitted json@1 {"summary":{"info":{"id":"exec-3",…
#     collect.out emitted json@1 [{…exec-4…},{…exec-3…}]
#     pick.out emitted json@1 {"winner":"exec-4","reason":"its diff does what the task asks"}
#     is_pick.pass emitted json@1 {"candidate":{…"id":"exec-4"…},"winner":"exec-4"}
#     is_pick.fail emitted json@1 {"candidate":{…"id":"exec-3"…},…}  → self.losers
#     queue.queued {"entry":1,…} · queue.check {"entry":1,"info":{"id":"exec-4",…}}
#     tests.exit emitted exit@1 {"code":0,"stdout":"tests ok in <wt>/exec-4",…}
#     queue.merged emitted json@1 {"entry":1,"merged":{"id":"exec-4",
#       "branch":"best-of-n/exec-4","base":"main","commit":"d80f09a…"}}   ← 12.7 s after go
#   In exec-3: agent.reply "Created `exec-3/hello.txt` containing the word hello." and
#   diff.exit {"code":0,"stdout":" hello.txt | 1 +\n 1 file changed…+hello"}. `regulus ps`:
#   exec-3 and exec-4 `attempt` stopped (child of exec-2). <repo>: merge commit d80f09a
#   on main, hello.txt says hello; branches best-of-n/exec-3 and best-of-n/exec-4 kept.
#   Without repo, worktrees, judge_model or test_command: "template `best-of-n` needs a
#   value for var …".
#   After the review fixes (17:35), a second run with n=2 stalled in the agents: opencode's
#   log said "Free usage limit reached" for glm-5.3-flash-free (the barrier waits, limit
#   4). The changed gates were run on their own with the applied profile's args: `is_pick`
#   on a 600 KB candidate on stdin passes the winner (exit 0) and fails the other (exit 1);
#   `tests` with test_command="echo first; sh <check>/check.sh" ran both in the worktree.
id = "best-of-n"
name = "Best-of-N on {{repo}}"
main_workflow_id = "best-of-n"

[template]
name = "best-of-n"
description = "Best-of-N: N agents try the same task in their own worktrees, a judge picks one, it merges after the tests"
requires = [
  { module = "regulus/flow", version = ">=0.1" },
  { module = "regulus/process", version = ">=0.1" },
  { module = "regulus/workspace", version = ">=0.1" },
  { module = "regulus/judge", version = ">=0.1" },
  { module = "regulus/providers", version = ">=0.1" },
  { module = "regulus/agent", version = ">=0.1" },
  { module = "regulus/engine-opencode", version = ">=0.1" },
]

[template.vars]
repo = { description = "absolute path of the git repository; its base branch must be checked out and clean for the merge" }
worktrees = { description = "absolute path of an existing folder for the attempts' worktrees, outside the repo; each agent runs in its own worktree under it" }
judge_model = { description = "model id the judge asks, as its provider names it (an Ollama model you pulled, an OpenRouter id...)" }
n = { description = "how many agents try the task", default = 3 }
model = { description = "model of the agents' engine node, as opencode names it (provider/model)", default = "opencode/glm-5.3-flash-free" }
judge_preset = { description = "provider template of the judge, from the providers module's presets.toml (ollama, openrouter-openai, anthropic...)", default = "ollama" }
judge_base_url = { description = "base URL of the judge's provider; empty: the preset's", default = "" }
judge_credential = { description = "the judge provider's key as secret:<name>; empty: none (a local model)", default = "" }
criteria = { description = "how the judge tells the best attempt", default = "Pick the candidate that does the task correctly and completely with the smallest, cleanest change." }
base = { description = "branch the worktrees start from and the winner merges into; empty: the repo's current branch", default = "" }
branch_prefix = { description = "prefix of each attempt's branch, before its execution id", default = "best-of-n/" }
test_command = { description = "shell line run inside the winner's worktree before merging; exit 0 merges (required: the judge never verifies alone)" }
merge_mode = { description = "merge (a merge commit), ff or squash", default = "merge" }
permissions = { description = "what the agents answer when their tools ask for permission: allow or reject", default = "allow" }
quota_bytes = { description = "bytes each worktree may hold before it says quota_exceeded", default = 1073741824 }
max_diff_bytes = { description = "bytes of each attempt's diff the judge sees", default = 8000 }
input = { description = "do not set: keeps {{input}} of the process nodes, the value they receive", default = "{{input}}" }

[[workflows]]
id = "best-of-n"
name = "Best-of-N"
kind = "main"
ports = [
  { id = "go", capability = "text@1", direction = "input", kind = "then" },
  { id = "pick", capability = "json@1", direction = "output", kind = "then" },
  { id = "losers", capability = "json@1", direction = "output", kind = "then" },
  { id = "tests", capability = "exit@1", direction = "output", kind = "then" },
  { id = "merged", capability = "json@1", direction = "output", kind = "then" },
  { id = "conflict", capability = "json@1", direction = "output", kind = "then" },
  { id = "rejected", capability = "json@1", direction = "output", kind = "then" },
  { id = "error", capability = "text@1", direction = "output", kind = "then" },
  { id = "judge_error", capability = "text@1", direction = "output", kind = "then" },
]

  # N copies of the task: each turn's body goes to `call` and straight back, so the
  # loop turns `n` times and stops. Every child gets the same task.
  [[workflows.nodes]]
  id = "loop"
  name = "N times"
  type = "loop"
  module_id = "regulus/flow@0.1.0"
  position = { x = 200, y = 200 }
  config = { max = {{n}} }
  ports = [
    { id = "in", capability = "text@1", direction = "input", kind = "then", cardinality = "many" },
    { id = "back", capability = "text@1", direction = "input", kind = "then", cardinality = "many" },
    { id = "body", capability = "text@1", direction = "output", kind = "then" },
    { id = "done", capability = "text@1", direction = "output", kind = "then" },
  ]

  # One child execution of `attempt` per value: its own worktree, its own agent.
  [[workflows.nodes]]
  id = "attempts"
  name = "Attempts"
  type = "call"
  module_id = "regulus/flow@0.1.0"
  position = { x = 350, y = 200 }
  config = { workflow = "attempt" }
  ports = [
    { id = "in", capability = "text@1", direction = "input", kind = "then", cardinality = "many" },
    { id = "out", capability = "json@1", direction = "output", kind = "then" },
    { id = "done", capability = "execution.end@1", direction = "output", kind = "then" },
  ]

  # Waits for the N answers and sends them together, as an array.
  [[workflows.nodes]]
  id = "collect"
  name = "All attempts"
  type = "join"
  module_id = "regulus/flow@0.1.0"
  position = { x = 500, y = 200 }
  config = { mode = "barrier", count = {{n}}, shape = "array" }
  ports = [
    { id = "in", capability = "json@1", direction = "input", kind = "then", cardinality = "many" },
    { id = "out", capability = "json@1", direction = "output", kind = "then" },
  ]

  [[workflows.nodes]]
  id = "cands"
  name = "Candidates"
  type = "variable"
  module_id = "regulus/flow@0.1.0"
  position = { x = 650, y = 350 }
  config = { name = "candidates", scope = "execution" }
  ports = [
    { id = "set", capability = "json@1", direction = "input", kind = "then", cardinality = "many" },
    { id = "get", capability = "json@1", direction = "input", kind = "then", cardinality = "many" },
    { id = "value", capability = "json@1", direction = "output", kind = "then" },
  ]

  # The judge: reads every candidate and names the best one by its workspace id, under a
  # strict schema.
  [[workflows.nodes]]
  id = "pick"
  name = "Pick the best"
  type = "extractor"
  module_id = "regulus/judge@0.1.0"
  position = { x = 650, y = 200 }
  config = { instructions = "{{criteria}} The input is a JSON array of candidates. Each has summary.info.id (its workspace id), summary.reply (what its agent said) and diff.stdout (what it changed, from git). Set winner to the summary.info.id of the best candidate, copied exactly, and say why in reason.", schema = { type = "object", properties = { winner = { type = "string" }, reason = { type = "string" } }, required = ["winner", "reason"], additionalProperties = false } }
  ports = [
    { id = "model", capability = "llm.endpoint@1", direction = "input", kind = "uses" },
    { id = "in", capability = "json@1", direction = "input", kind = "then", cardinality = "many" },
    { id = "out", capability = "json@1", direction = "output", kind = "then" },
    { id = "error", capability = "text@1", direction = "output", kind = "then" },
  ]

  # The judge's model: a provider template. Any `llm.endpoint@1` fits here.
  [[workflows.nodes]]
  id = "judge_model"
  name = "Judge model"
  type = "provider"
  module_id = "regulus/providers@0.1.0"
  position = { x = 650, y = 50 }
  config = { preset = "{{judge_preset}}", base_url = "{{judge_base_url}}", credential = "{{judge_credential}}", model = "{{judge_model}}" }
  ports = [{ id = "endpoint", capability = "llm.endpoint@1", direction = "output", kind = "uses" }]

  [[workflows.nodes]]
  id = "winner_id"
  name = "Winner id"
  type = "convert"
  module_id = "regulus/flow@0.1.0"
  position = { x = 800, y = 100 }
  config = { conversion = "template", template = "{{/winner}}" }
  ports = [
    { id = "in", capability = "json@1", direction = "input", kind = "then", cardinality = "many" },
    { id = "out", capability = "text@1", direction = "output", kind = "then" },
  ]

  [[workflows.nodes]]
  id = "winner"
  name = "Winner"
  type = "variable"
  module_id = "regulus/flow@0.1.0"
  position = { x = 950, y = 100 }
  config = { name = "winner", scope = "execution" }
  ports = [
    { id = "set", capability = "text@1", direction = "input", kind = "then", cardinality = "many" },
    { id = "get", capability = "json@1", direction = "input", kind = "then", cardinality = "many" },
    { id = "value", capability = "text@1", direction = "output", kind = "then" },
  ]

  # Each candidate on its own, paired with the winner's id.
  [[workflows.nodes]]
  id = "split"
  name = "Each candidate"
  type = "fanout"
  module_id = "regulus/flow@0.1.0"
  position = { x = 800, y = 350 }
  config = { mode = "split" }
  ports = [
    { id = "in", capability = "json@1", direction = "input", kind = "then", cardinality = "many" },
    { id = "out", capability = "json@1", direction = "output", kind = "then" },
  ]

  [[workflows.nodes]]
  id = "pair"
  name = "Candidate + winner"
  type = "join"
  module_id = "regulus/flow@0.1.0"
  position = { x = 1100, y = 350 }
  config = { mode = "barrier", shape = "object" }
  ports = [
    { id = "candidate", capability = "json@1", direction = "input", kind = "then", cardinality = "many" },
    { id = "winner", capability = "text@1", direction = "input", kind = "then", cardinality = "many" },
    { id = "out", capability = "json@1", direction = "output", kind = "then" },
  ]

  # Deterministic: is this candidate's workspace id the one the judge named? The value
  # passes through unchanged. A winner that names no candidate passes none. The value comes
  # on stdin: a long candidate would not fit in one argument.
  [[workflows.nodes]]
  id = "is_pick"
  name = "Is the pick?"
  type = "gate"
  module_id = "regulus/process@0.1.0"
  position = { x = 1250, y = 350 }
  config = { command = "sh", args = ["-c", 'v=$(cat); w=$(printf %s "$v" | sed -n "s/.*\"winner\":\"\([^\"]*\)\".*/\1/p"); i=$(printf %s "$v" | sed -n "s/.*\"info\":{[^}]*\"id\":\"\([^\"]*\)\".*/\1/p"); echo "winner=$w candidate=$i"; [ -n "$w" ] && [ "$w" = "$i" ]'], stdin = "yes", max_running = {{n}} }
  ports = [
    { id = "in", capability = "json@1", direction = "input", kind = "then", cardinality = "many" },
    { id = "pass", capability = "json@1", direction = "output", kind = "then" },
    { id = "fail", capability = "json@1", direction = "output", kind = "then" },
  ]

  [[workflows.nodes]]
  id = "to_info"
  name = "Its workspace"
  type = "convert"
  module_id = "regulus/flow@0.1.0"
  position = { x = 1400, y = 300 }
  config = { conversion = "template", template = "{{/candidate/summary/info}}" }
  ports = [
    { id = "in", capability = "json@1", direction = "input", kind = "then", cardinality = "many" },
    { id = "out", capability = "text@1", direction = "output", kind = "then" },
  ]

  [[workflows.nodes]]
  id = "info_json"
  name = "As JSON"
  type = "convert"
  module_id = "regulus/flow@0.1.0"
  position = { x = 1550, y = 300 }
  config = { conversion = "text_to_json" }
  ports = [
    { id = "in", capability = "text@1", direction = "input", kind = "then", cardinality = "many" },
    { id = "out", capability = "json@1", direction = "output", kind = "then" },
  ]

  # Only the winner is queued. It merges into `base` of `repo` once `tests` passes. `repo`
  # and `root` let it take a workspace made by a child that has already stopped.
  [[workflows.nodes]]
  id = "queue"
  name = "Merge queue"
  type = "merge_queue"
  module_id = "regulus/workspace@0.1.0"
  position = { x = 1700, y = 300 }
  config = { repo = "{{repo}}", root = "{{worktrees}}", merge_mode = "{{merge_mode}}" }
  ports = [
    { id = "in", capability = "json@1", direction = "input", kind = "then", cardinality = "many" },
    { id = "pass", capability = "text@1", direction = "input", kind = "then", cardinality = "many" },
    { id = "fail", capability = "text@1", direction = "input", kind = "then", cardinality = "many" },
    { id = "queued", capability = "json@1", direction = "output", kind = "then" },
    { id = "check", capability = "json@1", direction = "output", kind = "then" },
    { id = "merged", capability = "json@1", direction = "output", kind = "then" },
    { id = "conflict", capability = "json@1", direction = "output", kind = "then" },
    { id = "rejected", capability = "json@1", direction = "output", kind = "then" },
    { id = "error", capability = "text@1", direction = "output", kind = "then" },
  ]

  [[workflows.nodes]]
  id = "check_path"
  name = "Its folder"
  type = "convert"
  module_id = "regulus/flow@0.1.0"
  position = { x = 1700, y = 450 }
  config = { conversion = "template", template = "{{/info/path}}" }
  ports = [
    { id = "in", capability = "json@1", direction = "input", kind = "then", cardinality = "many" },
    { id = "out", capability = "text@1", direction = "output", kind = "then" },
  ]

  # The deterministic gate before merging: `test_command` inside the winner's worktree.
  [[workflows.nodes]]
  id = "tests"
  name = "Tests"
  type = "gate"
  module_id = "regulus/process@0.1.0"
  position = { x = 1850, y = 450 }
  config = { command = "sh", args = ["-c", "cd -- \"$1\" && ( {{test_command}} )", "sh", "{{input}}"] }
  ports = [
    { id = "in", capability = "text@1", direction = "input", kind = "then", cardinality = "many" },
    { id = "pass", capability = "text@1", direction = "output", kind = "then" },
    { id = "fail", capability = "text@1", direction = "output", kind = "then" },
    { id = "exit", capability = "exit@1", direction = "output", kind = "then" },
  ]

  [[workflows.wires]]
  id = "go-loop"
  kind = "then"
  from = { node_id = "self", port_id = "go" }
  to = { node_id = "loop", port_id = "in" }

  [[workflows.wires]]
  id = "loop-call"
  kind = "then"
  from = { node_id = "loop", port_id = "body" }
  to = { node_id = "attempts", port_id = "in" }

  [[workflows.wires]]
  id = "loop-again"
  kind = "then"
  from = { node_id = "loop", port_id = "body" }
  to = { node_id = "loop", port_id = "back" }

  [[workflows.wires]]
  id = "call-collect"
  kind = "then"
  from = { node_id = "attempts", port_id = "out" }
  to = { node_id = "collect", port_id = "in" }

  [[workflows.wires]]
  id = "collect-cands"
  kind = "then"
  from = { node_id = "collect", port_id = "out" }
  to = { node_id = "cands", port_id = "set" }

  [[workflows.wires]]
  id = "collect-pick"
  kind = "then"
  from = { node_id = "collect", port_id = "out" }
  to = { node_id = "pick", port_id = "in" }

  [[workflows.wires]]
  id = "pick-model"
  kind = "uses"
  from = { node_id = "judge_model", port_id = "endpoint" }
  to = { node_id = "pick", port_id = "model" }

  [[workflows.wires]]
  id = "pick-winner"
  kind = "then"
  from = { node_id = "pick", port_id = "out" }
  to = { node_id = "winner_id", port_id = "in" }

  [[workflows.wires]]
  id = "winner-set"
  kind = "then"
  from = { node_id = "winner_id", port_id = "out" }
  to = { node_id = "winner", port_id = "set" }

  [[workflows.wires]]
  id = "pick-cands"
  kind = "then"
  from = { node_id = "pick", port_id = "out" }
  to = { node_id = "cands", port_id = "get" }

  [[workflows.wires]]
  id = "pick-out"
  kind = "then"
  from = { node_id = "pick", port_id = "out" }
  to = { node_id = "self", port_id = "pick" }

  [[workflows.wires]]
  id = "cands-split"
  kind = "then"
  from = { node_id = "cands", port_id = "value" }
  to = { node_id = "split", port_id = "in" }

  [[workflows.wires]]
  id = "split-pair"
  kind = "then"
  from = { node_id = "split", port_id = "out" }
  to = { node_id = "pair", port_id = "candidate" }

  [[workflows.wires]]
  id = "split-winner"
  kind = "then"
  from = { node_id = "split", port_id = "out" }
  to = { node_id = "winner", port_id = "get" }

  [[workflows.wires]]
  id = "winner-pair"
  kind = "then"
  from = { node_id = "winner", port_id = "value" }
  to = { node_id = "pair", port_id = "winner" }

  [[workflows.wires]]
  id = "pair-gate"
  kind = "then"
  from = { node_id = "pair", port_id = "out" }
  to = { node_id = "is_pick", port_id = "in" }

  [[workflows.wires]]
  id = "gate-info"
  kind = "then"
  from = { node_id = "is_pick", port_id = "pass" }
  to = { node_id = "to_info", port_id = "in" }

  [[workflows.wires]]
  id = "gate-losers"
  kind = "then"
  from = { node_id = "is_pick", port_id = "fail" }
  to = { node_id = "self", port_id = "losers" }

  [[workflows.wires]]
  id = "info-json"
  kind = "then"
  from = { node_id = "to_info", port_id = "out" }
  to = { node_id = "info_json", port_id = "in" }

  [[workflows.wires]]
  id = "json-queue"
  kind = "then"
  from = { node_id = "info_json", port_id = "out" }
  to = { node_id = "queue", port_id = "in" }

  [[workflows.wires]]
  id = "queue-check"
  kind = "then"
  from = { node_id = "queue", port_id = "check" }
  to = { node_id = "check_path", port_id = "in" }

  [[workflows.wires]]
  id = "check-tests"
  kind = "then"
  from = { node_id = "check_path", port_id = "out" }
  to = { node_id = "tests", port_id = "in" }

  [[workflows.wires]]
  id = "tests-pass"
  kind = "then"
  from = { node_id = "tests", port_id = "pass" }
  to = { node_id = "queue", port_id = "pass" }

  [[workflows.wires]]
  id = "tests-fail"
  kind = "then"
  from = { node_id = "tests", port_id = "fail" }
  to = { node_id = "queue", port_id = "fail" }

  [[workflows.wires]]
  id = "tests-exit"
  kind = "then"
  from = { node_id = "tests", port_id = "exit" }
  to = { node_id = "self", port_id = "tests" }

  [[workflows.wires]]
  id = "queue-merged"
  kind = "then"
  from = { node_id = "queue", port_id = "merged" }
  to = { node_id = "self", port_id = "merged" }

  [[workflows.wires]]
  id = "queue-conflict"
  kind = "then"
  from = { node_id = "queue", port_id = "conflict" }
  to = { node_id = "self", port_id = "conflict" }

  [[workflows.wires]]
  id = "queue-rejected"
  kind = "then"
  from = { node_id = "queue", port_id = "rejected" }
  to = { node_id = "self", port_id = "rejected" }

  [[workflows.wires]]
  id = "queue-error"
  kind = "then"
  from = { node_id = "queue", port_id = "error" }
  to = { node_id = "self", port_id = "error" }

  [[workflows.wires]]
  id = "pick-error"
  kind = "then"
  from = { node_id = "pick", port_id = "error" }
  to = { node_id = "self", port_id = "judge_error" }

[[workflows]]
id = "attempt"
name = "One attempt"
kind = "extra"
ports = [
  { id = "in", capability = "text@1", direction = "input", kind = "then" },
  { id = "out", capability = "json@1", direction = "output", kind = "then" },
]

  # This attempt's own git worktree, `<worktrees>/<execution id>` on branch
  # `<branch_prefix><execution id>`, from `base` of `repo`. Kept when the attempt ends.
  [[workflows.nodes]]
  id = "ws"
  name = "Worktree"
  type = "workspace"
  module_id = "regulus/workspace@0.1.0"
  position = { x = 50, y = 50 }
  config = { engine = "git", repo = "{{repo}}", base = "{{base}}", root = "{{worktrees}}", branch_prefix = "{{branch_prefix}}", quota_bytes = {{quota_bytes}}, on_stop = "keep" }
  ports = [
    { id = "ready", capability = "path@1", direction = "output", kind = "then" },
    { id = "info", capability = "json@1", direction = "output", kind = "then" },
    { id = "quota_exceeded", capability = "json@1", direction = "output", kind = "then" },
    { id = "error", capability = "text@1", direction = "output", kind = "then" },
  ]

  [[workflows.nodes]]
  id = "j_prompt"
  name = "Task + worktree"
  type = "join"
  module_id = "regulus/flow@0.1.0"
  position = { x = 200, y = 150 }
  config = { mode = "barrier", shape = "object" }
  ports = [
    { id = "task", capability = "text@1", direction = "input", kind = "then", cardinality = "many" },
    { id = "info", capability = "json@1", direction = "input", kind = "then", cardinality = "many" },
    { id = "out", capability = "json@1", direction = "output", kind = "then" },
  ]

  # The agent already runs in the worktree (`ws.ready` → `agent.workdir`); the prompt
  # names it too, so the model knows the rules.
  [[workflows.nodes]]
  id = "compose"
  name = "Prompt"
  type = "convert"
  module_id = "regulus/flow@0.1.0"
  position = { x = 350, y = 150 }
  config = { conversion = "template", template = "# Task\n\n{{/task}}\n\n# Where\n\nYour own git worktree is {{/info/path}}, your working directory. Work only inside it: change files there with absolute paths or after cd into it, and do not commit. Other agents do the same task in other worktrees; the best attempt is merged.\n\n# Reply\n\nWhen done, reply with a short summary of what you changed.\n" }
  ports = [
    { id = "in", capability = "json@1", direction = "input", kind = "then", cardinality = "many" },
    { id = "out", capability = "text@1", direction = "output", kind = "then" },
  ]

  # `allow`: the agent edits files and runs commands unattended. Its cwd is the worktree
  # that reaches `workdir`; the field is the fallback.
  [[workflows.nodes]]
  id = "agent"
  name = "Agent"
  type = "agent"
  module_id = "regulus/agent@0.1.0"
  position = { x = 500, y = 150 }
  config = { workdir = "{{worktrees}}", permissions = "{{permissions}}", fresh_context = "yes" }
  ports = [
    { id = "engine", capability = "agent.engine@1", direction = "input", kind = "uses", required = true },
    { id = "prompt", capability = "text@1", direction = "input", kind = "then", cardinality = "many" },
    { id = "workdir", capability = "path@1", direction = "input", kind = "then" },
    { id = "reply", capability = "text@1", direction = "output", kind = "then" },
    { id = "failed", capability = "text@1", direction = "output", kind = "then" },
  ]

  # The engine: the only node that knows the CLI. Swap it for another engine node.
  [[workflows.nodes]]
  id = "engine"
  name = "opencode"
  type = "engine-opencode"
  module_id = "regulus/engine-opencode@0.1.0"
  position = { x = 500, y = 20 }
  config = { model = "{{model}}" }
  ports = [{ id = "engine", capability = "agent.engine@1", direction = "output", kind = "uses" }]

  [[workflows.nodes]]
  id = "j_reply"
  name = "Worktree + reply"
  type = "join"
  module_id = "regulus/flow@0.1.0"
  position = { x = 650, y = 150 }
  config = { mode = "barrier", shape = "object" }
  ports = [
    { id = "info", capability = "json@1", direction = "input", kind = "then", cardinality = "many" },
    { id = "reply", capability = "text@1", direction = "input", kind = "then", cardinality = "many" },
    { id = "out", capability = "json@1", direction = "output", kind = "then" },
  ]

  [[workflows.nodes]]
  id = "path_of"
  name = "Its folder"
  type = "convert"
  module_id = "regulus/flow@0.1.0"
  position = { x = 800, y = 250 }
  config = { conversion = "template", template = "{{/info/path}}" }
  ports = [
    { id = "in", capability = "json@1", direction = "input", kind = "then", cardinality = "many" },
    { id = "out", capability = "text@1", direction = "output", kind = "then" },
  ]

  # What the attempt changed, for the judge: everything staged, then the diff, cut at
  # `max_diff_bytes`. `exit` always fires, so the attempt always answers.
  [[workflows.nodes]]
  id = "diff"
  name = "Diff"
  type = "command"
  module_id = "regulus/process@0.1.0"
  position = { x = 950, y = 250 }
  config = { command = "sh", args = ["-c", "cd -- \"$1\" && git add -A && git diff --cached --stat && git diff --cached | head -c {{max_diff_bytes}}", "sh", "{{input}}"] }
  ports = [
    { id = "in", capability = "text@1", direction = "input", kind = "then", cardinality = "many" },
    { id = "exit", capability = "exit@1", direction = "output", kind = "then" },
  ]

  [[workflows.nodes]]
  id = "j_result"
  name = "Attempt"
  type = "join"
  module_id = "regulus/flow@0.1.0"
  position = { x = 1100, y = 150 }
  config = { mode = "barrier", shape = "object" }
  ports = [
    { id = "summary", capability = "json@1", direction = "input", kind = "then", cardinality = "many" },
    { id = "diff", capability = "exit@1", direction = "input", kind = "then", cardinality = "many" },
    { id = "out", capability = "json@1", direction = "output", kind = "then" },
  ]

  [[workflows.wires]]
  id = "in-task"
  kind = "then"
  from = { node_id = "self", port_id = "in" }
  to = { node_id = "j_prompt", port_id = "task" }

  [[workflows.wires]]
  id = "ws-prompt"
  kind = "then"
  from = { node_id = "ws", port_id = "info" }
  to = { node_id = "j_prompt", port_id = "info" }

  # `info` and then `ready` leave `ws` in that order, and the bus delivers in order, so
  # the agent has moved before the prompt that goes through `j_prompt` reaches it.
  [[workflows.wires]]
  id = "ws-workdir"
  kind = "then"
  from = { node_id = "ws", port_id = "ready" }
  to = { node_id = "agent", port_id = "workdir" }

  [[workflows.wires]]
  id = "ws-reply"
  kind = "then"
  from = { node_id = "ws", port_id = "info" }
  to = { node_id = "j_reply", port_id = "info" }

  [[workflows.wires]]
  id = "prompt-compose"
  kind = "then"
  from = { node_id = "j_prompt", port_id = "out" }
  to = { node_id = "compose", port_id = "in" }

  [[workflows.wires]]
  id = "compose-agent"
  kind = "then"
  from = { node_id = "compose", port_id = "out" }
  to = { node_id = "agent", port_id = "prompt" }

  [[workflows.wires]]
  id = "agent-engine"
  kind = "uses"
  from = { node_id = "engine", port_id = "engine" }
  to = { node_id = "agent", port_id = "engine" }

  [[workflows.wires]]
  id = "agent-reply"
  kind = "then"
  from = { node_id = "agent", port_id = "reply" }
  to = { node_id = "j_reply", port_id = "reply" }

  [[workflows.wires]]
  id = "agent-failed"
  kind = "then"
  from = { node_id = "agent", port_id = "failed" }
  to = { node_id = "j_reply", port_id = "reply" }

  [[workflows.wires]]
  id = "reply-path"
  kind = "then"
  from = { node_id = "j_reply", port_id = "out" }
  to = { node_id = "path_of", port_id = "in" }

  [[workflows.wires]]
  id = "path-diff"
  kind = "then"
  from = { node_id = "path_of", port_id = "out" }
  to = { node_id = "diff", port_id = "in" }

  [[workflows.wires]]
  id = "reply-result"
  kind = "then"
  from = { node_id = "j_reply", port_id = "out" }
  to = { node_id = "j_result", port_id = "summary" }

  [[workflows.wires]]
  id = "diff-result"
  kind = "then"
  from = { node_id = "diff", port_id = "exit" }
  to = { node_id = "j_result", port_id = "diff" }

  [[workflows.wires]]
  id = "result-out"
  kind = "then"
  from = { node_id = "j_result", port_id = "out" }
  to = { node_id = "self", port_id = "out" }
