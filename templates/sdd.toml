  [[workflows.wires]]
  id = "tasks-review"
  kind = "then"
  from = { node_id = "call_tasks", port_id = "out" }
  to = { node_id = "review_tasks", port_id = "in" }

  [[workflows.wires]]
  id = "tasks-write"
  kind = "then"
  from = { node_id = "review_tasks", port_id = "out" }
  to = { node_id = "write_tasks", port_id = "in" }

  [[workflows.wires]]
  id = "tasks-start"
  kind = "then"
  from = { node_id = "write_tasks", port_id = "written" }
  to = { node_id = "start", port_id = "in" }

  [[workflows.wires]]
  id = "start-converge"
  kind = "then"
