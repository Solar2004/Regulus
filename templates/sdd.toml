  [[workflows.wires]]
  id = "spec-rejected"
  kind = "then"
  from = { node_id = "review_spec", port_id = "rejected" }
  to = { node_id = "self", port_id = "rejected" }

  [[workflows.wires]]
  id = "spec-failed"
  kind = "then"
  from = { node_id = "call_spec", port_id = "failed" }
  to = { node_id = "self", port_id = "failed" }

  [[workflows.wires]]
  id = "plan-pending"
  kind = "then"
  from = { node_id = "review_plan", port_id = "pending" }
  to = { node_id = "self", port_id = "pending" }

  [[workflows.wires]]
  id = "plan-rejected"
  kind = "then"
  from = { node_id = "review_plan", port_id = "rejected" }
  to = { node_id = "self", port_id = "rejected" }

  [[workflows.wires]]
  id = "plan-failed"
  kind = "then"
  from = { node_id = "call_plan", port_id = "failed" }
  to = { node_id = "self", port_id = "failed" }

  [[workflows.wires]]
  id = "tasks-pending"
  kind = "then"
  from = { node_id = "review_tasks", port_id = "pending" }
  to = { node_id = "self", port_id = "pending" }

  [[workflows.wires]]
  id = "tasks-rejected"
  kind = "then"
  from = { node_id = "review_tasks", port_id = "rejected" }
  to = { node_id = "self", port_id = "rejected" }

  [[workflows.wires]]
  id = "tasks-failed"
  kind = "then"
  from = { node_id = "call_tasks", port_id = "failed" }
  to = { node_id = "self", port_id = "failed" }

# A persona: the constitution, read again on every call, before the task, to a new
# agent. Each `call` starts it as a child execution and takes its first answer.
[[workflows]]
id = "persona"
name = "Persona"
kind = "extra"
ports = [
  { id = "in", capability = "text@1", direction = "input", kind = "then" },
  { id = "out", capability = "text@1", direction = "output", kind = "then" },
  { id = "failed", capability = "text@1", direction = "output", kind = "then" },
]

  # The fixed document.
  [[workflows.nodes]]
  id = "constitution"
  name = "Constitution"
  type = "read"
  module_id = "regulus/files@0.1.0"
  position = { x = 50, y = 50 }
  config = { path = "{{constitution}}", dir = "{{workdir}}" }
  ports = [
    { id = "in", capability = "text@1", direction = "input", kind = "then", cardinality = "many" },
    { id = "out", capability = "text@1", direction = "output", kind = "then" },
  ]

  [[workflows.nodes]]
  id = "join"
  name = "Constitution + task"
  type = "join"
  module_id = "regulus/flow@0.1.0"
  position = { x = 200, y = 100 }
  config = { mode = "barrier", shape = "object" }
  ports = [
    { id = "constitution", capability = "text@1", direction = "input", kind = "then", cardinality = "many" },
    { id = "task", capability = "text@1", direction = "input", kind = "then", cardinality = "many" },
    { id = "out", capability = "json@1", direction = "output", kind = "then" },
  ]

  [[workflows.nodes]]
  id = "compose"
  name = "Prompt"
  type = "convert"
  module_id = "regulus/flow@0.1.0"
  position = { x = 350, y = 100 }
  config = { conversion = "template", template = "# Constitution ({{constitution}})\n\nEverything you do follows it.\n\n{{/constitution}}\n\n# Task\n\n{{/task}}\n" }
  ports = [
    { id = "in", capability = "json@1", direction = "input", kind = "then", cardinality = "many" },
    { id = "out", capability = "text@1", direction = "output", kind = "then" },
  ]

  # A new child per call, so every phase starts from nothing but the files.
  [[workflows.nodes]]
  id = "agent"
  name = "Agent"
  type = "agent"
  module_id = "regulus/agent@0.1.0"
  position = { x = 500, y = 100 }
  config = { workdir = "{{workdir}}", permissions = "{{permissions}}", turn_timeout_ms = {{turn_timeout_ms}} }
  ports = [
    { id = "engine", capability = "agent.engine@1", direction = "input", kind = "uses", required = true },
    { id = "prompt", capability = "text@1", direction = "input", kind = "then", cardinality = "many" },
    { id = "reply", capability = "text@1", direction = "output", kind = "then" },
    { id = "failed", capability = "text@1", direction = "output", kind = "then" },
  ]

  # The engine: the only node that knows the CLI. Swap it for another engine node.
  [[workflows.nodes]]
  id = "engine"
  name = "opencode"
  type = "engine-opencode"
  module_id = "regulus/engine-opencode@0.1.0"
  position = { x = 500, y = 0 }
  config = { model = "{{model}}" }
  ports = [{ id = "engine", capability = "agent.engine@1", direction = "output", kind = "uses" }]

  [[workflows.wires]]
  id = "agent-engine"
  kind = "uses"
  from = { node_id = "engine", port_id = "engine" }
  to = { node_id = "agent", port_id = "engine" }

  [[workflows.wires]]
  id = "in-read"
  kind = "then"
  from = { node_id = "self", port_id = "in" }
  to = { node_id = "constitution", port_id = "in" }

  [[workflows.wires]]
  id = "in-join"
  kind = "then"
  from = { node_id = "self", port_id = "in" }
  to = { node_id = "join", port_id = "task" }

  [[workflows.wires]]
  id = "read-join"
  kind = "then"
  from = { node_id = "constitution", port_id = "out" }
  to = { node_id = "join", port_id = "constitution" }

  [[workflows.wires]]
  id = "join-compose"
  kind = "then"
  from = { node_id = "join", port_id = "out" }
  to = { node_id = "compose", port_id = "in" }

  [[workflows.wires]]
  id = "compose-agent"
  kind = "then"
  from = { node_id = "compose", port_id = "out" }
  to = { node_id = "agent", port_id = "prompt" }

  [[workflows.wires]]
  id = "agent-out"
  kind = "then"
  from = { node_id = "agent", port_id = "reply" }
  to = { node_id = "self", port_id = "out" }

  [[workflows.wires]]
  id = "agent-failed"
  kind = "then"
  from = { node_id = "agent", port_id = "failed" }
  to = { node_id = "self", port_id = "failed" }
