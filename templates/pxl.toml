  [[workflows.wires]]
  id = "human-notes"
  kind = "then"
  from = { node_id = "human", port_id = "out" }
  to = { node_id = "notes", port_id = "in" }

  [[workflows.wires]]
  id = "human-pending"
  kind = "then"
  from = { node_id = "human", port_id = "pending" }
  to = { node_id = "self", port_id = "pending" }

  [[workflows.wires]]
  id = "notes-pass"
  kind = "then"
  from = { node_id = "notes", port_id = "pass" }
  to = { node_id = "human_pass", port_id = "in" }

  [[workflows.wires]]
  id = "notes-fail"
  kind = "then"
  from = { node_id = "notes", port_id = "fail" }
  to = { node_id = "human_fail", port_id = "in" }

  [[workflows.wires]]
  id = "rejected"
  kind = "then"
  from = { node_id = "human", port_id = "rejected" }
  to = { node_id = "human_rejected", port_id = "in" }

  [[workflows.wires]]
  id = "pass-back"
  kind = "then"
  from = { node_id = "human_pass", port_id = "out" }
  to = { node_id = "loop", port_id = "back" }

  [[workflows.wires]]
  id = "fail-back"
  kind = "then"
  from = { node_id = "human_fail", port_id = "out" }
  to = { node_id = "loop", port_id = "back" }

  [[workflows.wires]]
  id = "rejected-back"
  kind = "then"
  from = { node_id = "human_rejected", port_id = "out" }
  to = { node_id = "loop", port_id = "back" }

  [[workflows.wires]]
  id = "loop-done"
  kind = "then"
  from = { node_id = "loop", port_id = "done" }
