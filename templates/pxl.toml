  kind = "then"
  from = { node_id = "loop", port_id = "done" }
  to = { node_id = "png_path", port_id = "in" }

  [[workflows.wires]]
  id = "png-out"
  kind = "then"
  from = { node_id = "png_path", port_id = "out" }
  to = { node_id = "self", port_id = "png" }

  [[workflows.wires]]
  id = "loop-exhausted"
  kind = "then"
  from = { node_id = "loop", port_id = "exhausted" }
  to = { node_id = "self", port_id = "exhausted" }

  [[workflows.wires]]
  id = "viewer-started"
  kind = "then"
  from = { node_id = "viewer", port_id = "started" }
  to = { node_id = "self", port_id = "serving" }

  [[workflows.wires]]
