  kind = "then"
  from = { node_id = "task_review", port_id = "value" }
  to = { node_id = "preview_join", port_id = "task" }

  [[workflows.wires]]
  id = "preview-format"
  kind = "then"
  from = { node_id = "preview_join", port_id = "out" }
  to = { node_id = "preview", port_id = "in" }

  [[workflows.wires]]
  id = "preview-review"
  kind = "then"
  from = { node_id = "preview", port_id = "out" }
  to = { node_id = "{{review}}", port_id = "in" }

  [[workflows.wires]]
  id = "judge-pass"
  kind = "then"
  from = { node_id = "judge", port_id = "pass" }
  to = { node_id = "tag_pass", port_id = "in" }

  [[workflows.wires]]
  id = "judge-fail"
  kind = "then"
  from = { node_id = "judge", port_id = "fail" }
  to = { node_id = "tag_fail", port_id = "in" }

  [[workflows.wires]]
  id = "pass-verdict"
  kind = "then"
  from = { node_id = "tag_pass", port_id = "out" }
  to = { node_id = "verdict_join", port_id = "verdict" }

  [[workflows.wires]]
  id = "fail-verdict"
  kind = "then"
  from = { node_id = "tag_fail", port_id = "out" }
  to = { node_id = "verdict_join", port_id = "verdict" }

  [[workflows.wires]]
  id = "feedback-verdict"
  kind = "then"
  from = { node_id = "judge", port_id = "feedback" }
  to = { node_id = "verdict_join", port_id = "feedback" }

  [[workflows.wires]]
  id = "verdict-format"
  kind = "then"
  from = { node_id = "verdict_join", port_id = "out" }
