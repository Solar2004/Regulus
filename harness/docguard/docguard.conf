# docguard — configuración
#
# Única fuente de verdad del comportamiento de docguard (principio 1, Flexible). El código
# de `docguard.py` no lleva ni un literal de los de aquí: todo tiene su valor por defecto
# en el script y se sobreescribe en este fichero. Mismo formato que `.gitconventions`:
# `clave = valor`, listas separadas por espacios, una clave repetida acumula valores.
#
# Documentación: `docs/10-docguard.md`.

# Interruptor general. `false` = los hooks no hacen nada (ni bloquean ni gastan tokens).
enabled = true

# --- Juez (capa semántica) --------------------------------------------------------

# Modelo headless, en formato provider/model de opencode (`opencode models`).
judge_model = opencode/muse-spark-1.3-contributor-free
# Agente de opencode con el que corre el juez. `plan` es el agente integrado de solo
# lectura. No vale un agente propio ni recortarle herramientas: el tier gratuito de Zen
# rechaza las peticiones cuyo prompt de sistema o lista de herramientas no son los de
# opencode ("free tier can only be used from within OpenCode"). Por eso el juez corre en
# un directorio temporal vacío: aunque intentara escribir, no tocaría el repo.
judge_agent = plan
# Segundos antes de abandonar al juez. Si se agota, docguard deja parar al agente y avisa:
# un fallo de la infraestructura nunca bloquea el trabajo.
judge_timeout = 240
# Reglas máximas por llamada al juez. Con más, se juzga por tandas: la precisión de un
# modelo cae al subir el número de instrucciones simultáneas (docs/10-docguard.md §3).
judge_rules_per_call = 15
# Segunda pasada del juez solo sobre lo que encontró la primera, para tirar nitpicks y
# falsos positivos. Solo cuesta tokens cuando ya hay hallazgos.
judge_verify = true

# --- Bucle de corrección ----------------------------------------------------------

# Veces seguidas que docguard puede impedir que el agente pare. Agotadas, deja parar y
# te enseña lo que quedó pendiente.
max_rounds = 2
# Hallazgos máximos por mensaje. Más comentarios = peor revisión (ver docs/10-docguard.md).
max_findings = 5
# Bytes de diff máximos por llamada al juez. opencode trunca los adjuntos grandes y el
# juez se queda sin ver parte del prompt, así que un diff mayor se reparte por ficheros
# en varias llamadas en vez de cortarse.
max_diff_bytes = 24000
# Llamadas máximas al juez por revisión. Si un cambio necesita más, se revisa en parte y
# se avisa.
judge_max_calls = 6

# --- Verificación al terminar (capa `check`) --------------------------------------

# `check = <globs> :: <comando>`. Si el agente cambió algún fichero que casa con los globs,
# al terminar se corre el comando desde la raíz del repo; si sale con error, el agente no
# para y recibe la salida. Va antes que `forbid` y que el juez: si falla, el juez ni se
# paga. Lo que más resta nota a un agente es dar por terminado algo sin comprobarlo
# (docs/ideas/harness-optimization.md §3b). Un `#` empieza comentario: no lo uses en el
# comando. Los globs de rutas que aún no existen no cuestan nada.
check = crates/regulus-tauri/frontend/src/** crates/regulus-tauri/frontend/*.json crates/regulus-tauri/frontend/*.ts :: cd crates/regulus-tauri/frontend && npx --no-install tsc --noEmit -p .
check = harness/**/*.py :: python3 -m py_compile harness/*/*.py
check = crates/** Cargo.toml Cargo.lock :: cargo test --workspace --quiet
# Segundos máximos por comando. Si se agota, no bloquea (fallo de infraestructura).
check_timeout = 300
# Caracteres finales de la salida que recibe el agente.
check_output_chars = 1500

# --- Detector de bucles -----------------------------------------------------------

# Ediciones del mismo fichero en una sesión a partir de las cuales el agente recibe un
# aviso (una vez) para que replantee en vez de seguir parcheando. 0 = desactivado.
# Valor sin medir: afínalo con `docguard eval` y trazas reales.
loop_edits = 8

# --- Decisiones contra los principios (capa `decide`) ---------------------------

# Cuando el agente elige entre caminos sin contrastarlos con docs/00-principles.md, se le
# para una vez con el checklist (prompts/decide.md). 0 tokens: solo regex.
decide = true
# Herramientas con las que el agente presenta opciones o un plan al usuario. Usarlas ya es
# una elección: se les exige que nombren los principios sin buscar marcadores.
decide_tools = AskUserQuestion ExitPlanMode question
# Regex (sin distinguir mayúsculas, sin espacios: usa \s) que delatan una elección en la
# respuesta final del agente. Los bloques de código no cuentan. Sin medir: afínalo con
# `docguard decide` y respuestas reales.
decide_markers = opci[oó]n(es)?\s+(A|B|C|1|2|3)\b alternativas? en\s+(vez|lugar)\s+de
decide_markers = (he\s+)?eleg[ií]do? opt[eé]\s+por me\s+decant[eéo] descart[eéoa] trade-?offs?
decide_markers = \bvs\.?\s pros\s+y\s+contras ventajas\s+e\s+inconvenientes
decide_markers = \boption\s+[A-C1-3]\b instead\s+of \bI\s+chose alternatives?
# Opciones en lista con letra ("A) SQLite", "**B.** sled"). Con números no: casi toda
# lista numerada es una lista de pasos, no una elección.
decide_markers = (?m)^\W*[A-C][).]\s
# Regex que cuentan como "lo ha contrastado con los principios". Basta una.
principle_markers = flexib modular personaliz presupuesto infraestructura guardarra[ií]l
principle_markers = 00-principles principios? como\s+el\s+agua ablaci[oó]n sin\s+recompilar

# --- Eval -------------------------------------------------------------------------

# Gold set de `docguard eval`, relativo a harness/docguard/.
eval_dir = eval/cases

# --- Atribución ---------------------------------------------------------------------

# `touched`: a cada sesión solo se le revisan los ficheros que editó con sus herramientas
# (Edit/Write/patch), cruzados con el diff. Imprescindible con varios agentes en el mismo
# árbol. Lo que el agente cambie por bash no se ve. `worktree`: todo lo que cambió en git
# desde que empezó la sesión.
attribution = touched

# --- Reglas justo a tiempo --------------------------------------------------------

# La primera vez que un agente toca una ruta, recibe solo las reglas que le aplican.
jit_context = true
# Ficheros que el agente ya tiene siempre en contexto. Sus reglas se juzgan al terminar
# pero no se re-inyectan: serían duplicados.
always_loaded = AGENTS.md CLAUDE.md
# Caracteres máximos inyectados por fichero tocado.
jit_max_chars = 1500

# --- Qué no se revisa -------------------------------------------------------------

ignore_paths = **/node_modules/** **/target/** **/dist/** *.lock pnpm-lock.yaml package-lock.json
ignore_paths = *.png *.jpg *.jpeg *.gif *.webp *.ico *.icns *.svg *.woff *.woff2 *.ttf *.otf *.pdf

# --- Compilación de reglas (`docguard compile`) -----------------------------------

# Documentos de los que se extraen reglas. Se recompila solo la sección que cambió.
compile_sources = AGENTS.md docs/00-principles.md docs/02-architecture.md docs/03-modules.md
compile_sources = docs/04-client.md docs/06-stack.md docs/08-design-system.md docs/09-git.md
# Nivel de encabezado que delimita una sección (2 = `##`).
compile_heading_level = 2
compile_model = opencode/muse-spark-1.3-contributor-free
