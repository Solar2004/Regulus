[package]
name = "regulus-cli"
description = "The regulus command: runs the core and talks to it like any other client"
version.workspace = true
edition.workspace = true
authors.workspace = true

[[bin]]
name = "regulus"
path = "src/main.rs"

[dependencies]
regulus-proto.workspace = true
regulus-core.workspace = true
regulus-module-hello = { path = "../modules/hello" }
regulus-module-flow = { path = "../modules/flow" }
regulus-module-hooks = { path = "../modules/hooks" }
regulus-module-agent = { path = "../modules/agent" }
regulus-module-engine-opencode = { path = "../modules/engine-opencode" }
regulus-module-engine-claude = { path = "../modules/engine-claude" }
regulus-module-providers = { path = "../modules/providers" }
regulus-module-skills = { path = "../modules/skills" }
regulus-module-communication = { path = "../modules/communication" }
regulus-module-tools = { path = "../modules/tools" }
regulus-module-tools-mcp = { path = "../modules/tools-mcp" }
regulus-module-files = { path = "../modules/files" }
regulus-module-process = { path = "../modules/process" }
regulus-module-guards = { path = "../modules/guards" }
regulus-module-judge = { path = "../modules/judge" }
regulus-module-triggers = { path = "../modules/triggers" }
regulus-module-memory = { path = "../modules/memory" }
regulus-contract-tool.workspace = true
anyhow.workspace = true
clap.workspace = true
jsonrpsee = { workspace = true, features = ["ws-client"] }
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
