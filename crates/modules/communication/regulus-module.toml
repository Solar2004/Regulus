[module]
id             = "regulus/communication@0.1.0"
name           = "Communication"
requires_proto = "^1.2"
methods        = ["comm.send", "comm.history", "comm.participants"]

# The idea and the message model come from hcom; the code is Regulus's own
# (docs/plan.md §4.1).
[module.origin]
author  = "aannoo"
repo    = "https://github.com/aannoo/hcom"
license = "MIT"
honors  = "aannoo, author of hcom"

# A channel delivers each message to the participants it names with @name, or to all of
# them but the sender. Each participant gets its messages one at a time, in order, and
# only once it is free: a busy agent is asked again every `poll_ms`.
[[node]]
type = "channel"
name = "Channel"

  [[node.port]]
  id          = "participants"
  name        = "participants"
  capability  = "participant@1"
  direction   = "input"
  kind        = "uses"
  cardinality = "many"
  # Read only while running, so participants may use this channel's tools.
  lazy        = true

  # What agents can do in the channel (send, participants, inbox), for a tools box to
  # present them. Sends are made in the caller's name, set by its Agent box.
  [[node.port]]
  id         = "tools"
  name       = "tools"
  capability = "tool@1"
  direction  = "output"
  kind       = "uses"

  # How often to ask a busy participant whether it is free.
  [[node.field]]
  id      = "poll_ms"
  type    = "number"
  default = 500

  # How long a message waits for a busy participant before it is given up.
  [[node.field]]
  id      = "max_wait_seconds"
  type    = "number"
  default = 600

  # How many messages the `inbox` tool returns at most, the newest ones.
  [[node.field]]
  id      = "inbox_limit"
  type    = "number"
  default = 20
