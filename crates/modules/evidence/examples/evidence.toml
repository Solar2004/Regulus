  [[workflows.wires]]
  id = "tiny-error"
  kind = "then"
  from = { node_id = "tiny", port_id = "error" }
  to = { node_id = "self", port_id = "tiny_error" }

  [[workflows.wires]]
  id = "tiny-sourced"
  kind = "then"
  from = { node_id = "tiny", port_id = "sourced" }
  to = { node_id = "self", port_id = "tiny_sourced" }
