[module]
id             = "regulus/flow@0.1.0"
name           = "Flow"
requires_proto = "^1.8"

# Runs a workflow of the same profile as a child execution, once per value received, and
# waits for its answer (docs/13-blocks.md §3.2). Ports match the called workflow's by id:
# a value on input `x` goes to its input `x`; what it returns on output `y` leaves on
# output `y` of this node. They are declared on the node, never copied from the workflow:
# the ones below fit a workflow with `in` and `out`, and a node calling another shape
# declares that workflow's ports itself. `profile.check` warns when they do not line up
# (`field.workflow_ports_mismatch`); `execution.start` refuses a workflow that is missing.
[[node]]
type = "call"
name = "Call"

  [[node.port]]
  id          = "in"
  name        = "in"
  capability  = "text@1"
  direction   = "input"
  kind        = "then"
  cardinality = "many"

  [[node.port]]
  id         = "out"
  name       = "out"
  capability = "text@1"
  direction  = "output"
  kind       = "then"

  # Once per child, when it is no longer live: `{ execution_id, workflow_id, state }`,
  # `state` as `execution.list` spells it (`stopped` after an answer, `failed`…).
  [[node.port]]
  id         = "done"
  name       = "done"
  capability = "execution.end@1"
  direction  = "output"
  kind       = "then"

  # The id of a workflow of this profile with at least one "then" output.
  [[node.field]]
  id      = "workflow"
  type    = "workflow"
  default = ""
