[module]
id             = "regulus/flow@0.1.0"
name           = "Flow"
requires_proto = "^1.8"

# Runs a workflow of the same profile as a child execution, once per value received, and
# waits for its answer (docs/13-blocks.md §3.2). Ports match the called workflow's by id:
# a value on input `x` goes to its input `x`; what it returns on output `y` leaves on
# output `y` of this node. They are declared on the node, never copied from the workflow:
# the ones below fit a workflow with `in` and `out`, and a node calling another shape
# declares that workflow's ports itself. `profile.check` warns when they do not line up
# (`field.workflow_ports_mismatch`); `execution.start` refuses a workflow that is missing.
# Whatever is wired into a "uses" input the node declares goes to the child's "uses" input
# of the same id; one the workflow has and the node lacks is warned about
# (`field.workflow_uses_unbound`).
[[node]]
type = "call"
name = "Call"

  [[node.port]]
  id          = "in"
  name        = "in"
  capability  = "text@1"
  direction   = "input"
  kind        = "then"
  cardinality = "many"

  [[node.port]]
  id         = "out"
  name       = "out"
  capability = "text@1"
  direction  = "output"
  kind       = "then"

  # Once per child, when it is no longer live: `{ execution_id, workflow_id, state }`,
  # `state` as `execution.list` spells it (`stopped` after an answer, `failed`…).
  [[node.port]]
  id         = "done"
  name       = "done"
  capability = "execution.end@1"
  direction  = "output"
  kind       = "then"

  # The id of a workflow of this profile with at least one "then" output.
  [[node.field]]
  id      = "workflow"
  type    = "workflow"
  default = ""

# Map-collect (docs/13-blocks.md §3.2): an array on `in` runs `workflow` once per element
# (anything else is one element), each element on the child's "then" input `input`, at
# most `max_in_flight` children live at once. Every answer leaves on `item` as
# `{ batch, index, port, value }`; when all children are over, `done` carries `{ batch,
# total, returned, failed, cancelled, results: [{ index, port?, value?, error? }] }`
# in element order. `timeout_ms` after the batch starts, the children still running are
# stopped and that summary leaves on `partial` instead. Any value on `cancel` stops the
# node's batches (summary on `done`). Children are tagged `<batch>/<index>`
# (`regulus exec tree`). The node's ports are its own, not the workflow's; whatever is
# wired into a "uses" input the node declares goes to the child's "uses" input of the
# same id (e.g. a `provider` both have), and `profile.check` warns about one the
# workflow has and the node does not (`field.workflow_uses_unbound`).
[[node]]
type = "batch"
name = "Batch"

  [[node.port]]
  id          = "in"
  name        = "in"
  capability  = "json@1"
  direction   = "input"
  kind        = "then"
  cardinality = "many"

  [[node.port]]
  id         = "cancel"
  name       = "cancel"
  capability = "json@1"
  direction  = "input"
  kind       = "then"

  [[node.port]]
  id         = "item"
  name       = "item"
  capability = "json@1"
  direction  = "output"
  kind       = "then"

  [[node.port]]
  id         = "done"
  name       = "done"
  capability = "json@1"
  direction  = "output"
  kind       = "then"

  [[node.port]]
  id         = "partial"
  name       = "partial"
  capability = "json@1"
  direction  = "output"
  kind       = "then"

  # The id of a workflow of this profile with at least one "then" output.
  [[node.field]]
  id        = "workflow"
  type      = "workflow"
  default   = ""
  own_ports = true

  # The child's "then" input each element goes to. Empty: `in`.
  [[node.field]]
  id      = "input"
  type    = "text"
  default = "in"

  # Children live at once; 0: as many as `[call] max_children` lets one execution have
  # (past it, the next element waits for one to end).
  [[node.field]]
  id      = "max_in_flight"
  type    = "number"
  default = 4

  # Milliseconds from the start of a batch to `partial`; 0: no limit.
  [[node.field]]
  id      = "timeout_ms"
  type    = "number"
  default = 0

  # continue: a child that ends without an answer counts in `failed`, the rest go on.
  # cancel: the first one stops the batch.
  [[node.field]]
  id      = "on_failure"
  type    = "select"
  default = "continue"
  options = ["continue", "cancel"]

# A workflow as a tool (`tool@1`, docs/13-blocks.md §3.2): wire `tools` into a Tools box
# and an agent calls the workflow like any other tool. Each call runs `workflow` as a
# called child, its arguments on the child's "then" inputs. The node's "then" inputs
# mirror the workflow's, like `call`'s (`field.workflow_ports_mismatch` otherwise), and
# make the arguments' schema: one property per input, a string for `text@1`/`path@1`,
# any value otherwise; or, with `input` set, one `text` string for that input. What the
# child returns is the answer, `{ port, value }`, and also leaves on the node's output of
# the same id. `call` mode waits up to `timeout_ms`; `job` mode answers `{ job }` at once
# and adds `<name>_status`, `<name>_result` and `<name>_cancel`. Whatever is wired into a
# "uses" input the node declares goes to the child's input of the same id: swap what is
# wired there and the tool runs on something else, with no change to the tool.
[[node]]
type = "tool"
name = "Workflow tool"

  [[node.port]]
  id         = "tools"
  name       = "tools"
  capability = "tool@1"
  direction  = "output"
  kind       = "uses"

  [[node.port]]
  id         = "in"
  name       = "in"
  capability = "text@1"
  direction  = "input"
  kind       = "then"

  [[node.port]]
  id         = "out"
  name       = "out"
  capability = "text@1"
  direction  = "output"
  kind       = "then"

  # The id of a workflow of this profile with at least one "then" output.
  [[node.field]]
  id      = "workflow"
  type    = "workflow"
  default = ""

  # The tool's name for the agent: letters, digits, `_` and `-`. Empty: the node's id.
  [[node.field]]
  id      = "name"
  type    = "text"
  default = ""

  # What it does, for the agent to decide when to call it. Empty: says which workflow.
  [[node.field]]
  id      = "description"
  type    = "text"
  default = ""

  # call: the answer comes back in the same call. job: a handle at once, and three more
  # tools to follow it.
  [[node.field]]
  id      = "mode"
  type    = "select"
  default = "call"
  options = ["call", "job"]

  # call mode: milliseconds to wait for the answer, then the child is stopped; 0: no limit.
  [[node.field]]
  id      = "timeout_ms"
  type    = "number"
  default = 600000

  # Calls and running jobs at once; past it a call is refused. 0: no limit here.
  [[node.field]]
  id      = "max_in_flight"
  type    = "number"
  default = 4

  # The one "then" input that takes the `text` argument. Empty: one property per input.
  [[node.field]]
  id      = "input"
  type    = "text"
  default = ""

  # job mode: finished jobs remembered for `_result`; the oldest go first. 0: all.
  [[node.field]]
  id      = "jobs_keep"
  type    = "number"
  default = 100

# The nodes below take any capability: their ports are declared on each node in the
# profile, and the ones here are the defaults the canvas starts from. A value leaves with
# the capability of the output it goes out on, unchanged; to change what a value is, put
# a `convert` in the wire.

# Routes each value to the outputs whose rule it meets (docs/13-blocks.md §3.2). Outputs
# are declared on the node, one per case, plus `fallback` for what meets none.
[[node]]
type = "switch"
name = "Switch"

  [[node.port]]
  id          = "in"
  name        = "in"
  capability  = "text@1"
  direction   = "input"
  kind        = "then"
  cardinality = "many"

  [[node.port]]
  id         = "other"
  name       = "other"
  capability = "text@1"
  direction  = "output"
  kind       = "then"

  # rules: the cases, in order. enum: the value at `path` names the output.
  [[node.field]]
  id      = "mode"
  type    = "select"
  default = "rules"
  options = ["rules", "enum"]

  # Each case: `{ port, op, value, path }`. `op` is one of equals, not_equals, contains,
  # regex, exists, empty, greater, less; `path` a JSON Pointer (`/verdict`) or dotted
  # path (`verdict.score`) into the value, empty for the whole value. To compare two
  # parts of the same value, `value_path` instead of `value`: another path into it,
  # whose target is what `path`'s is compared with, e.g.
  # `{ port = "same", op = "equals", path = "/candidate/id", value_path = "/winner" }`.
  # `value_path` wins over `value`; one that points at nothing fails the case; `exists`
  # and `empty` ignore it. `equals` and `not_equals` compare values, or their text when
  # the values differ: "3" equals 3.
  [[node.field]]
  id      = "cases"
  type    = "rules"
  default = []

  # enum mode: where the output name is in the value. Empty: the value itself.
  [[node.field]]
  id      = "path"
  type    = "text"
  default = ""

  # first: the first case that matches. all: every one.
  [[node.field]]
  id      = "match"
  type    = "select"
  default = "first"
  options = ["first", "all"]

  # The output for values that meet no case. If the node lacks it, they are dropped.
  [[node.field]]
  id      = "fallback"
  type    = "text"
  default = "other"

  # Bytes a compiled `regex` pattern may take, above 0; a larger one is refused. Each
  # pattern is compiled once and kept.
  [[node.field]]
  id      = "regex_size_limit"
  type    = "number"
  default = 1048576

# Repeats a body: `in` starts it, `body` goes out each turn, `back` brings the turn's
# result. It ends when `back` meets `until` or after `max` turns, on `done`; a cap reached
# goes out on `exhausted` if the node has it. The core's `[bus] max_depth` stays the
# safety net under it, except across nodes that emit from threads of their own (`wait`).
# One run per node: a new value on `in` while a run goes ends that run, sending its last
# value on `exhausted` if the node has it (nothing otherwise), and starts over at turn 1.
# Each turn is checkpointed, so after a restart that resumes the execution `back` finds
# its run.
[[node]]
type = "loop"
name = "Loop"

  [[node.port]]
  id          = "in"
  name        = "in"
  capability  = "text@1"
  direction   = "input"
  kind        = "then"
  cardinality = "many"

  [[node.port]]
  id          = "back"
  name        = "back"
  capability  = "text@1"
  direction   = "input"
  kind        = "then"
  cardinality = "many"

  [[node.port]]
  id         = "body"
  name       = "body"
  capability = "text@1"
  direction  = "output"
  kind       = "then"

  [[node.port]]
  id         = "done"
  name       = "done"
  capability = "text@1"
  direction  = "output"
  kind       = "then"

  # Most turns. 0: no cap of its own.
  [[node.field]]
  id      = "max"
  type    = "number"
  default = 10

  # A rule, as one case of `switch` without `port`: `{ op = "contains", value = "DONE" }`
  # (or `value_path` to compare with another part of the value).
  # Empty: only `max` ends it.
  [[node.field]]
  id      = "until"
  type    = "rule"
  default = {}

  # Bytes a compiled `regex` pattern may take, above 0; a larger one is refused. Each
  # pattern is compiled once and kept.
  [[node.field]]
  id      = "regex_size_limit"
  type    = "number"
  default = 1048576

# Fan-in. any: every value goes on. barrier: waits for one value on each "then" input
# declared on the node (or for `count` values on any) and sends them together.
[[node]]
type = "join"
name = "Join"

  [[node.port]]
  id          = "a"
  name        = "a"
  capability  = "text@1"
  direction   = "input"
  kind        = "then"
  cardinality = "many"

  [[node.port]]
  id          = "b"
  name        = "b"
  capability  = "text@1"
  direction   = "input"
  kind        = "then"
  cardinality = "many"

  [[node.port]]
  id         = "out"
  name       = "out"
  capability = "json@1"
  direction  = "output"
  kind       = "then"

  # barrier with `timeout_ms`: what a round had when its time ran out, shaped like `out`.
  # With `count`, the values gathered so far (fewer than `count`), in arrival order. By
  # input, the first value of each one and `null` for an input that sent none: an array
  # in declared order, or an object by input with `shape = "object"`. Values queued
  # behind those stay for the next round. Sent from a thread of the node (a new chain,
  # depth 0). Without this output, what ran out is dropped and logged.
  [[node.port]]
  id         = "timeout"
  name       = "timeout"
  capability = "json@1"
  direction  = "output"
  kind       = "then"

  [[node.field]]
  id      = "mode"
  type    = "select"
  default = "barrier"
  options = ["barrier", "any"]

  # barrier: milliseconds a round may wait, from the first value it holds (or from what
  # stays queued when one opens); past it, what came goes out on `timeout` and the
  # barrier starts over empty. 0: it waits forever.
  [[node.field]]
  id      = "timeout_ms"
  type    = "number"
  default = 0

  # barrier: 0 waits for each input; N waits for N values on any of them.
  [[node.field]]
  id      = "count"
  type    = "number"
  default = 0

  # array: in the order inputs are declared (or arrived, with `count`). object: by input.
  [[node.field]]
  id      = "shape"
  type    = "select"
  default = "array"
  options = ["array", "object"]

  # barrier: values one input may hold while it waits for the others, above 0. Past it, a
  # new value is dropped and its delivery shows as `failed`. A barrier with no "then"
  # inputs and no `count` is refused at start.
  [[node.field]]
  id      = "max_queue"
  type    = "number"
  default = 64

# Fan-out: one value to every "then" output of the node, or, with `split`, each element
# of an array, one after another.
[[node]]
type = "fanout"
name = "Fan-out"

  [[node.port]]
  id          = "in"
  name        = "in"
  capability  = "text@1"
  direction   = "input"
  kind        = "then"
  cardinality = "many"

  [[node.port]]
  id         = "out"
  name       = "out"
  capability = "text@1"
  direction  = "output"
  kind       = "then"

  [[node.field]]
  id      = "mode"
  type    = "select"
  default = "copy"
  options = ["copy", "split"]

# Holds each value `ms` milliseconds, on a thread of its own, then sends it on. Stopping
# the node drops what it holds.
[[node]]
type = "wait"
name = "Wait"

  [[node.port]]
  id          = "in"
  name        = "in"
  capability  = "text@1"
  direction   = "input"
  kind        = "then"
  cardinality = "many"

  [[node.port]]
  id         = "out"
  name       = "out"
  capability = "text@1"
  direction  = "output"
  kind       = "then"

  [[node.field]]
  id      = "ms"
  type    = "number"
  default = 1000

  # Values one node may hold at once, above 0 (0 is refused at start). Past it, a new
  # value is dropped and its delivery shows as `failed` on the bus.
  [[node.field]]
  id      = "max_pending"
  type    = "number"
  default = 64

# A named value kept in the store: `set` writes it, any value on `get` sends it out on
# `value`. Kept per execution (it survives a restart that resumes it) or per project.
[[node]]
type = "variable"
name = "Variable"

  [[node.port]]
  id          = "set"
  name        = "set"
  capability  = "text@1"
  direction   = "input"
  kind        = "then"
  cardinality = "many"

  [[node.port]]
  id          = "get"
  name        = "get"
  capability  = "text@1"
  direction   = "input"
  kind        = "then"
  cardinality = "many"

  [[node.port]]
  id         = "value"
  name       = "value"
  capability = "text@1"
  direction  = "output"
  kind       = "then"

  # Nodes with the same name share the value. Empty: the node's id.
  [[node.field]]
  id      = "name"
  type    = "text"
  default = ""

  [[node.field]]
  id      = "scope"
  type    = "select"
  default = "execution"
  options = ["execution", "project"]

  # What `get` sends before anything was set. Unset: nothing.
  [[node.field]]
  id   = "initial"
  type = "json"

# Changes what a value is, between capabilities: the compatibility box that goes in a
# wire whose ends do not fit. `auto` picks the conversion by the input and output
# capabilities (table in src/convert.rs); a non-empty `template` always wins, and a pair
# the table lacks passes the value as it is (`same`). `text_to_json` turns text that
# reads as JSON into that JSON (`"3"` becomes the number 3) and leaves other text a
# string; `json_to_text` keeps a string as is and writes anything else as JSON. In a
# template a missing field is empty and any non-string is its JSON.
[[node]]
type = "convert"
name = "Convert"

  [[node.port]]
  id          = "in"
  name        = "in"
  capability  = "json@1"
  direction   = "input"
  kind        = "then"
  cardinality = "many"

  [[node.port]]
  id         = "out"
  name       = "out"
  capability = "text@1"
  direction  = "output"
  kind       = "then"

  [[node.field]]
  id      = "conversion"
  type    = "select"
  default = "auto"
  options = ["auto", "same", "text_to_json", "json_to_text", "join", "split", "template"]

  # `{{field}}`, `{{a.b}}` or `{{/a/0}}` from the value; `{{.}}` is the whole value.
  [[node.field]]
  id      = "template"
  type    = "text"
  default = ""

  # What `join` puts between elements and `split` cuts at.
  [[node.field]]
  id      = "separator"
  type    = "text"
  default = "\n"

  # json_to_text: indented JSON.
  [[node.field]]
  id      = "pretty"
  type    = "select"
  default = "no"
  options = ["no", "yes"]
