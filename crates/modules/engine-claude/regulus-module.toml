[module]
id             = "regulus/engine-claude@0.1.0"
name           = "Claude Code engine"
requires_proto = "^1.2"
methods        = ["claude.detect"]

[[node]]
type = "engine-claude"
name = "Claude Code"

  [[node.port]]
  id         = "engine"
  name       = "engine"
  capability = "agent.engine@1"
  direction  = "output"
  kind       = "uses"

  # The claude binary the adapter drives (CLAUDE_CODE_EXECUTABLE). Empty: the first
  # `claude` on PATH. Detection also lists profile binaries named claude-*-bin.
  [[node.field]]
  id      = "installation"
  type    = "text"
  default = ""

  # user: config_dir, or the user's own setup if empty. isolated: a profile with only what
  # is wired in, kept per node by Regulus unless config_dir says where (docs/12-agents.md §6.3).
  [[node.field]]
  id      = "profile"
  type    = "select"
  default = "user"
  options = ["user", "isolated"]

  # CLAUDE_CONFIG_DIR for this agent, e.g. ~/.claude-ultra. Empty: see profile.
  [[node.field]]
  id      = "config_dir"
  type    = "text"
  default = ""

  # The ACP adapter, as a command line split on spaces. The pinned version lives here
  # and only here (docs/06-stack.md §2.1).
  [[node.field]]
  id      = "adapter"
  type    = "text"
  default = "npx -y @agentclientprotocol/claude-agent-acp@0.93.0"

  [[node.field]]
  id      = "startup_seconds"
  type    = "number"
  default = 120

  # How many session events (text, tool calls, permission requests…) each session keeps
  # for `engine.session.events`; the oldest go first.
  [[node.field]]
  id      = "events_keep"
  type    = "number"
  default = 2000

  # Seconds a permission request waits for a decision when the box asks
  # (`permissions = "ask"`); then the reject option is chosen.
  [[node.field]]
  id      = "permission_timeout_seconds"
  type    = "number"
  default = 600
