[module]
id             = "regulus/engine-opencode@0.1.0"
name           = "opencode engine"
requires_proto = "^1.2"
methods        = ["opencode.detect"]

[[node]]
type = "engine-opencode"
name = "opencode"

  [[node.port]]
  id         = "engine"
  name       = "engine"
  capability = "agent.engine@1"
  direction  = "output"
  kind       = "uses"

  # Path to the opencode binary. Empty: the first one on PATH.
  [[node.field]]
  id      = "installation"
  type    = "text"
  default = ""

  # user: config_dir, or the user's own setup if empty. isolated: a profile with only what
  # is wired in, kept per node by Regulus unless config_dir says where (docs/12-agents.md §6.3).
  [[node.field]]
  id      = "profile"
  type    = "select"
  default = "user"
  options = ["user", "isolated"]

  # OPENCODE_CONFIG_DIR for this agent, Empty: see profile.
  [[node.field]]
  id      = "config_dir"
  type    = "text"
  default = ""

  # The opencode model id (`opencode/glm-5.3-flash-free`, `anthropic/claude-sonnet-4-5`…)
  # when no provider is wired into the box. A wired provider wins over it. Empty: the
  # engine's own setup decides (docs/12-agents.md §6.8).
  [[node.field]]
  id      = "model"
  type    = "text"
  default = ""

  [[node.field]]
  id      = "startup_seconds"
  type    = "number"
  default = 60

  # How many session events (text, tool calls, permission requests…) each session keeps
  # for `engine.session.events`; the oldest go first.
  [[node.field]]
  id      = "events_keep"
  type    = "number"
  default = 2000

  # Seconds a permission request waits for a decision when the box asks
  # (`permissions = "ask"`); then the reject option is chosen.
  [[node.field]]
  id      = "permission_timeout_seconds"
  type    = "number"
  default = 600
