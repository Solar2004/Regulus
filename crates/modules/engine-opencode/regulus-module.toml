[module]
id             = "regulus/engine-opencode@0.1.0"
name           = "opencode engine"
requires_proto = "^1.2"
methods        = ["opencode.detect"]

[[node]]
type = "engine-opencode"
name = "opencode"

  [[node.port]]
  id         = "engine"
  name       = "engine"
  capability = "agent.engine@1"
  direction  = "output"
  kind       = "uses"

  # Path to the opencode binary. Empty: the first one on PATH.
  [[node.field]]
  id      = "installation"
  type    = "text"
  default = ""

  # OPENCODE_CONFIG_DIR for this agent. Empty: the user's own opencode setup.
  [[node.field]]
  id      = "config_dir"
  type    = "text"
  default = ""

  [[node.field]]
  id      = "startup_seconds"
  type    = "number"
  default = 60
