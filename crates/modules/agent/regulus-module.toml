[module]
id             = "regulus/agent@0.1.0"
name           = "Agent"
requires_proto = "^1.9"
# `agent.prompt` { execution_id, node_id, text } → the turn (blocks until it ends);
# `agent.send` { execution_id, node_id, text } → { turn } (queued like `prompt`, at once);
# `agent.history` { execution_id, node_id, since?, limit? } → { entries, activity, next,
# session }; `agent.cancel` { execution_id, node_id } → null. CLI: `regulus agent …`.
methods        = ["agent.prompt", "agent.send", "agent.history", "agent.cancel"]

[[node]]
type = "agent"
name = "Agent"

  # The CLI that runs this agent: Claude Code, opencode… whatever engine is wired here.
  # Required because without an engine there is no agent at all: the box is disabled and
  # says so, the rest of the execution keeps running (docs/03-modules.md §1.1).
  [[node.port]]
  id         = "engine"
  name       = "engine"
  capability = "agent.engine@1"
  direction  = "input"
  kind       = "uses"
  required   = true

  # The model the engine uses. Optional: without one, the engine's own setup decides
  # (docs/12-agents.md §6).
  [[node.port]]
  id         = "provider"
  name       = "provider"
  capability = "llm.endpoint@1"
  direction  = "input"
  kind       = "uses"

  # Providers for one purpose each (docs/12-agents.md §6.5). Optional: an empty slot
  # uses the main provider. Any other llm.endpoint input added here is a slot too, named
  # after its id; each engine says which slots it knows.
  [[node.port]]
  id         = "fast"
  name       = "fast"
  capability = "llm.endpoint@1"
  direction  = "input"
  kind       = "uses"

  [[node.port]]
  id         = "subagent"
  name       = "subagent"
  capability = "llm.endpoint@1"
  direction  = "input"
  kind       = "uses"

  # The agent as someone channels deliver messages to (docs/11-composition.md §3): each
  # message arrives as a prompt in its session.
  [[node.port]]
  id         = "participant"
  name       = "participant"
  capability = "participant@1"
  direction  = "output"
  kind       = "uses"

  # Skills the agent loads (docs/12-agents.md §3). The engine places them in the profile.
  [[node.port]]
  id          = "skills"
  name        = "skills"
  capability  = "skill@1"
  direction   = "input"
  kind        = "uses"
  cardinality = "many"

  # Who answers the engine's permission requests when `permissions = "ask"`: a Decider
  # of `human`, or any node offering decision@1. Optional: without it, `ask` rejects.
  [[node.port]]
  id         = "decisions"
  name       = "decisions"
  capability = "decision@1"
  direction  = "input"
  kind       = "uses"

  # The name channels know the agent by (`@name`). Empty: the node id.
  [[node.field]]
  id      = "name"
  type    = "text"
  default = ""

  # Tools the agent can call, mounted in its name (docs/11-composition.md §3.0).
  [[node.port]]
  id          = "tools"
  name        = "tools"
  capability  = "toolset@1"
  direction   = "input"
  kind        = "uses"
  cardinality = "many"

  # Hooks the engine's CLI asks at points of its life cycle: before a tool, when the
  # agent stops… (docs/13-blocks.md §4). The engine writes them into the profile.
  [[node.port]]
  id          = "hooks"
  name        = "hooks"
  capability  = "hook@1"
  direction   = "input"
  kind        = "uses"
  cardinality = "many"

  # Prompts over the bus: each value is prompted into the session like `agent.prompt`
  # does (text as is, anything else as its JSON). They queue per node and go one at a
  # time, on a thread of the box: the bus never waits for the agent.
  [[node.port]]
  id          = "prompt"
  name        = "prompt"
  capability  = "text@1"
  direction   = "input"
  kind        = "then"
  cardinality = "many"

  # Moves the agent: the turns that start after a value arrives run in that directory, in
  # a session opened there. ACP fixes a session's directory when it opens, so changing
  # directory CLOSES the session and opens a new one: the context is lost. A path as text, or an
  # object with `path` (a workspace's `info`); wire `workspace.ready` here. Empty text:
  # back to the `workdir` field. A path that is not an existing absolute directory is
  # refused on arrival and kept, so the turns after it fail on `failed` instead of running
  # somewhere else.
  [[node.port]]
  id         = "workdir"
  name       = "workdir"
  capability = "path@1"
  direction  = "input"
  kind       = "then"

  # The agent's final reply to each value of `prompt`.
  [[node.port]]
  id         = "reply"
  name       = "reply"
  capability = "text@1"
  direction  = "output"
  kind       = "then"

  # Instead of `reply`, never with it: why the prompt failed (the engine failed, is gone
  # or the queue was full), so a loop can feed it back.
  [[node.port]]
  id         = "failed"
  name       = "failed"
  capability = "text@1"
  direction  = "output"
  kind       = "then"

  # Before `reply`, the tokens the turn took, `{ input_tokens, output_tokens }`, each one
  # only when known. Nothing when the engine gives no usage (none does yet).
  [[node.port]]
  id         = "usage"
  name       = "usage"
  capability = "json@1"
  direction  = "output"
  kind       = "then"

  # Each event of the engine's session as the box reads it during a turn: text and
  # reasoning as they stream, tool calls and their updates, plans, permission requests
  # and their answers, turn boundaries, state. The value is the event's JSON
  # (`{ seq, at, turn?, kind, … }`). Nothing from an engine without events.
  [[node.port]]
  id         = "activity"
  name       = "activity"
  capability = "agent.event@1"
  direction  = "output"
  kind       = "then"

  # yes: the box ends its engine session and opens a new one before each prompt (from
  # `prompt`, `agent.prompt` or a channel), so nothing carries over between turns.
  [[node.field]]
  id      = "fresh_context"
  type    = "select"
  default = "no"
  options = ["no", "yes"]

  # How many values may wait on `prompt` while one runs. Past it a value goes to `failed`,
  # with the value in the text, and is not retried. A value in flight when the node stops
  # gives nothing, neither `reply` nor `failed`.
  [[node.field]]
  id      = "max_queue"
  type    = "number"
  default = 16

  # How many characters of a dropped value `failed` repeats.
  [[node.field]]
  id      = "failed_echo_chars"
  type    = "number"
  default = 2000

  # Milliseconds one turn may take (a provider past its quota, a hung adapter). When they
  # run out the turn is cancelled (`engine.session.cancel`, ACP `session/cancel`) and
  # leaves on `failed` as "turn timed out after N ms"; it never gives `reply`. 0: no
  # limit.
  [[node.field]]
  id      = "turn_timeout_ms"
  type    = "number"
  default = 0

  # Milliseconds a timed-out turn has to end once cancelled. An engine without cancel, or
  # a turn still running past this, loses its session (the process ends) and the next
  # turn opens a new one, without the context.
  [[node.field]]
  id      = "cancel_grace_ms"
  type    = "number"
  default = 5000

  # Where the agent works until a value reaches the `workdir` input. Empty: the user's
  # home directory.
  [[node.field]]
  id      = "workdir"
  type    = "text"
  default = ""

  # What to answer when the agent asks for permission. `ask`: the request goes to what is
  # wired into `decisions` and waits for its choice (the engine's own time limit picks the
  # reject option); with nothing wired there it rejects, and the history says so.
  [[node.field]]
  id      = "permissions"
  type    = "select"
  default = "reject"
  options = ["reject", "allow", "ask"]

  # yes: the box records the conversation (prompts, replies, failures and the session's
  # events) in its store, in the conversation `conversation` names: `agent.history`.
  [[node.field]]
  id      = "history"
  type    = "select"
  default = "yes"
  options = ["yes", "no"]

  # Which conversation the node records into and, with `resume = native`, resumes the
  # engine session of. `execution`: its own, one per execution and node; two executions
  # of one workflow (two workers called at once) never see each other's turns, and the
  # same execution finds it again after a reconnect or a core restart. `named`: the one
  # called `conversation_id`, for whichever node names it next, so a later execution goes
  # on with it. `workflow`: one per workflow node across executions, the earlier layout,
  # which also reads what was recorded before this field existed. A shared one (`named`,
  # `workflow`) is held by one running node at a time: another node that asks for it while
  # it is held fails to start and says who holds it.
  [[node.field]]
  id      = "conversation"
  type    = "select"
  default = "execution"
  options = ["execution", "named", "workflow"]

  # The conversation's name with `conversation = named`: letters, digits, `-`, `_`, `.`
  # and `:`. It is shared by the whole project: two nodes naming it continue one
  # conversation, one after the other.
  [[node.field]]
  id      = "conversation_id"
  type    = "text"
  default = ""

  # How many entries, and how many events, the history keeps; the oldest go first.
  [[node.field]]
  id      = "history_max"
  type    = "number"
  default = 2000

  # native: the node loads the last engine session of its conversation by the engine's
  # own id (ACP `session/load`), so the agent keeps its context, when the engine can;
  # otherwise it starts a new session and the history says so. Only a conversation that
  # had a session resumes: with `conversation = execution`, the same execution after a
  # core restart; with `named` or `workflow`, the next execution that continues it.
  # Never with `fresh_context = yes` or `history = no`. no: every start opens a new
  # session; the history is Regulus' record, not the agent's context.
  [[node.field]]
  id      = "resume"
  type    = "select"
  default = "no"
  options = ["no", "native"]

  # Milliseconds between reads of the session's events during a turn.
  [[node.field]]
  id      = "events_poll_ms"
  type    = "number"
  default = 200

  # Milliseconds between reads of a pending decision.
  [[node.field]]
  id      = "decision_poll_ms"
  type    = "number"
  default = 500

  # yes: each session event leaves on `activity`.
  [[node.field]]
  id      = "activity_emit"
  type    = "select"
  default = "yes"
  options = ["yes", "no"]
