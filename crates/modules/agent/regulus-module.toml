[module]
id             = "regulus/agent@0.1.0"
name           = "Agent"
requires_proto = "^1.9"
methods        = ["agent.prompt"]

[[node]]
type = "agent"
name = "Agent"

  # The CLI that runs this agent: Claude Code, opencode… whatever engine is wired here.
  # Required because without an engine there is no agent at all: the box is disabled and
  # says so, the rest of the execution keeps running (docs/03-modules.md §1.1).
  [[node.port]]
  id         = "engine"
  name       = "engine"
  capability = "agent.engine@1"
  direction  = "input"
  kind       = "uses"
  required   = true

  # The model the engine uses. Optional: without one, the engine's own setup decides
  # (docs/12-agents.md §6).
  [[node.port]]
  id         = "provider"
  name       = "provider"
  capability = "llm.endpoint@1"
  direction  = "input"
  kind       = "uses"

  # Providers for one purpose each (docs/12-agents.md §6.5). Optional: an empty slot
  # uses the main provider. Any other llm.endpoint input added here is a slot too, named
  # after its id; each engine says which slots it knows.
  [[node.port]]
  id         = "fast"
  name       = "fast"
  capability = "llm.endpoint@1"
  direction  = "input"
  kind       = "uses"

  [[node.port]]
  id         = "subagent"
  name       = "subagent"
  capability = "llm.endpoint@1"
  direction  = "input"
  kind       = "uses"

  # The agent as someone channels deliver messages to (docs/11-composition.md §3): each
  # message arrives as a prompt in its session.
  [[node.port]]
  id         = "participant"
  name       = "participant"
  capability = "participant@1"
  direction  = "output"
  kind       = "uses"

  # Skills the agent loads (docs/12-agents.md §3). The engine places them in the profile.
  [[node.port]]
  id          = "skills"
  name        = "skills"
  capability  = "skill@1"
  direction   = "input"
  kind        = "uses"
  cardinality = "many"

  # The name channels know the agent by (`@name`). Empty: the node id.
  [[node.field]]
  id      = "name"
  type    = "text"
  default = ""

  # Tools the agent can call, mounted in its name (docs/11-composition.md §3.0).
  [[node.port]]
  id          = "tools"
  name        = "tools"
  capability  = "toolset@1"
  direction   = "input"
  kind        = "uses"
  cardinality = "many"

  # Hooks the engine's CLI asks at points of its life cycle: before a tool, when the
  # agent stops… (docs/13-blocks.md §4). The engine writes them into the profile.
  [[node.port]]
  id          = "hooks"
  name        = "hooks"
  capability  = "hook@1"
  direction   = "input"
  kind        = "uses"
  cardinality = "many"

  # Prompts over the bus: each value is prompted into the session like `agent.prompt`
  # does (text as is, anything else as its JSON). They queue per node and go one at a
  # time, on a thread of the box: the bus never waits for the agent.
  [[node.port]]
  id          = "prompt"
  name        = "prompt"
  capability  = "text@1"
  direction   = "input"
  kind        = "then"
  cardinality = "many"

  # The agent's final reply to each value of `prompt`.
  [[node.port]]
  id         = "reply"
  name       = "reply"
  capability = "text@1"
  direction  = "output"
  kind       = "then"

  # Instead of `reply`, never with it: why the prompt failed (the engine failed, is gone
  # or the queue was full), so a loop can feed it back.
  [[node.port]]
  id         = "failed"
  name       = "failed"
  capability = "text@1"
  direction  = "output"
  kind       = "then"

  # Before `reply`, the tokens the turn took, `{ input_tokens, output_tokens }`, each one
  # only when known. Nothing when the engine gives no usage (none does yet).
  [[node.port]]
  id         = "usage"
  name       = "usage"
  capability = "json@1"
  direction  = "output"
  kind       = "then"

  # yes: the box ends its engine session and opens a new one before each prompt (from
  # `prompt`, `agent.prompt` or a channel), so nothing carries over between turns.
  [[node.field]]
  id      = "fresh_context"
  type    = "select"
  default = "no"
  options = ["no", "yes"]

  # How many values may wait on `prompt` while one runs. Past it a value goes to `failed`.
  [[node.field]]
  id      = "max_queue"
  type    = "number"
  default = 16

  # Where the agent works. Empty: the user's home directory.
  [[node.field]]
  id      = "workdir"
  type    = "text"
  default = ""

  # What to answer when the agent asks for permission. Asking a person arrives with the bus.
  [[node.field]]
  id      = "permissions"
  type    = "select"
  default = "reject"
  options = ["reject", "allow"]
