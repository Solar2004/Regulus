[module]
id             = "regulus/hello@0.1.0"
name           = "Hello"
requires_proto = "^1"
methods        = ["hello.greet"]

[[node]]
type = "greeter"
name = "Greeter"

  [[node.port]]
  id         = "greeting"
  name       = "greeting"
  capability = "text@1"
  direction  = "output"
  kind       = "uses"

  # On start the greeting goes out here: the proof that "then" wires carry data.
  [[node.port]]
  id         = "tick"
  name       = "tick"
  capability = "text@1"
  direction  = "output"
  kind       = "then"

  # Whatever arrives here is answered back to the core as received and, if the node has
  # a `reply` port, greeted on it.
  [[node.port]]
  id          = "echo"
  name        = "echo"
  capability  = "text@1"
  direction   = "input"
  kind        = "then"
  cardinality = "many"

  # The greeting for whatever arrived on `echo`: "Alexander" comes back as "Hello, Alexander!".
  [[node.port]]
  id         = "reply"
  name       = "reply"
  capability = "text@1"
  direction  = "output"
  kind       = "then"

  [[node.field]]
  id      = "name"
  type    = "text"
  default = "world"
